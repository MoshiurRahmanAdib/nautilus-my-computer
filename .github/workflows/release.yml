name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  check-main:
    name: Check tag is on main
    runs-on: ubuntu-latest
    outputs:
      on_main: ${{ steps.check.outputs.on_main }}

    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Check tag targets main
        id: check
        run: |
          if git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${{ github.ref_name }} does not point to a commit on main -- skipping release. Tag a commit on main to publish."
            echo "on_main=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Create release
    needs: check-main
    if: needs.check-main.outputs.on_main == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="## v$version" '
            $0 == ver { found=1; next }
            found && /^---$/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file release-notes.md
