name: Packaging

on:
  push:
    branches: [main, dev]
    paths:
      - "Makefile"
      - "packaging/**"
      - ".github/workflows/packaging.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "Makefile"
      - "packaging/**"
      - ".github/workflows/packaging.yml"

jobs:
  makefile-build:
    name: Makefile build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: make build
        run: make build

      - name: make DESTDIR install/uninstall round-trip
        run: |
          make DESTDIR=/tmp/fakeroot PREFIX=/usr install
          test -f /tmp/fakeroot/usr/share/nautilus-python/extensions/nautilus-my-computer.py
          make DESTDIR=/tmp/fakeroot PREFIX=/usr uninstall

  # aur-validate is disabled while the AUR account is blocked (see
  # aur-publish.yml's aur-publish job, gated `&& false`). It failed on every
  # release because .SRCINFO was never kept in sync for a package that isn't
  # actually being published. Re-enable both together once AUR is unblocked.

  fedora-validate:
    name: Validate Fedora spec
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install rpm tooling
        run: dnf install -y rpmlint rpmdevtools

      - name: Parse spec
        run: rpmspec --parse packaging/copr/nautilus-my-computer.spec

      - name: rpmlint spec
        run: rpmlint packaging/copr/nautilus-my-computer.spec

  opensuse-validate:
    name: Validate openSUSE spec
    runs-on: ubuntu-latest
    container: opensuse/tumbleweed:latest

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install rpm tooling
        run: zypper --non-interactive install rpmlint rpmdevtools

      - name: Parse spec
        run: rpmspec --parse packaging/obs/nautilus-my-computer.spec

      - name: rpmlint spec
        run: rpmlint packaging/obs/nautilus-my-computer.spec

  ubuntu-validate:
    name: Validate Ubuntu PPA packaging
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install devscripts and build tools
        run: sudo apt-get update && sudo apt-get install -y devscripts build-essential debhelper lintian gettext

      - name: Copy debian/ to repo root
        run: cp -r packaging/ppa/debian ./debian

      - name: Build binary package
        run: dpkg-buildpackage -us -uc -b

      - name: lintian
        run: lintian ../nautilus-my-computer_*.deb

      - name: Verify installed paths
        run: |
          dpkg-deb --contents ../nautilus-my-computer_*.deb | tee /tmp/contents.txt
          grep -q "usr/share/nautilus-python/extensions/nautilus-my-computer.py" /tmp/contents.txt
          grep -q "usr/share/nautilus-python/extensions/nautilus_my_computer/" /tmp/contents.txt
          grep -q "usr/share/glib-2.0/schemas/io.github.yannmasoch.nautilus-my-computer.gschema.xml" /tmp/contents.txt

  nix-validate:
    name: Validate Nix flake
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      # path:$PWD?dir=packaging/nix treats the whole repo as the fetched tree
      # with the flake at packaging/nix, so `src = ../../.` can reach the repo
      # root. `nix build ./packaging/nix` would copy only the subdirectory.
      - name: Build flake
        run: nix build --print-build-logs "path:$GITHUB_WORKSPACE?dir=packaging/nix"

      - name: Verify installed paths
        run: |
          test -f result/share/nautilus-python/extensions/nautilus-my-computer.py
          test -d result/share/nautilus-python/extensions/nautilus_my_computer
          # package.nix moves the schema back to the standard XDG path (off the
          # glib hook's gsettings-schemas prefix) so it works cross-distro.
          test -f result/share/glib-2.0/schemas/io.github.yannmasoch.nautilus-my-computer.gschema.xml
          test -f result/share/glib-2.0/schemas/gschemas.compiled
