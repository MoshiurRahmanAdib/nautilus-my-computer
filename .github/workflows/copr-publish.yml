name: Trigger COPR build

on:
  push:
    tags:
      - 'v*'

jobs:
  check-main:
    name: Check tag is on main
    runs-on: ubuntu-latest
    outputs:
      on_main: ${{ steps.check.outputs.on_main }}

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Check tag targets main
        id: check
        run: |
          if git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${{ github.ref_name }} does not point to a commit on main -- skipping publish. Tag a commit on main to publish."
            echo "on_main=false" >> "$GITHUB_OUTPUT"
          fi

  copr-build:
    name: Trigger COPR build for tag
    needs: check-main
    if: needs.check-main.outputs.on_main == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger build via COPR API
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
        run: |
          curl -sSL --fail-with-body -u "$COPR_LOGIN:$COPR_TOKEN" \
            -X POST "https://copr.fedorainfracloud.org/api_3/build/create/scm" \
            -H "Content-Type: application/json" \
            -d "{
              \"ownername\": \"yannmasoch\",
              \"projectname\": \"nautilus-my-computer\",
              \"clone_url\": \"https://github.com/${GITHUB_REPOSITORY}\",
              \"committish\": \"${GITHUB_REF_NAME}\",
              \"subdirectory\": \"packaging/copr\",
              \"spec\": \"nautilus-my-computer.spec\",
              \"source_build_method\": \"rpkg\"
            }"
